version: 2

registries:
  nuget-official:
    type: nuget-feed
    url: https://api.nuget.org/v3/index.json

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'nuget'
    directory: '/'
    registries: ['nuget-official']
    schedule:
      interval: 'weekly'

    ignore:
      # Framework packages must stay on the major version of the target framework they are
      # referenced for, moving to a new major is done together with adding that framework
      - dependency-name: 'Microsoft.AspNetCore.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']

    groups:
      non-major-deps:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'
